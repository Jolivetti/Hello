{% extends "claims/layout.html" %}

{% block title %}Reset Link Dispatched | LegalCRM{% endblock %}

{% block body %}
<div class="row justify-content-center py-5">
    <div class="col-12 col-md-5 col-lg-4">
        <div class="card shadow-sm border-0 rounded-3 text-center">
            <div class="card-body p-4 p-md-5">
                <div class="d-inline-flex p-3 rounded-circle bg-success bg-opacity-10 text-success mb-3">
                    <i data-lucide="mail-check" style="width: 36px; height: 36px;"></i>
                </div>
                <h4 class="fw-bold text-dark mb-2">Check Your Email</h4>
                <p class="text-muted small mb-4">
                    If an account exists with that address, we have dispatched instructions and a secure recovery link.
                </p>
                <a href="{% url 'login' %}" class="btn btn-outline-secondary w-100 py-2 fw-semibold">
                    Back to Sign In
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
