{% extends "claims/layout.html" %}

{% block title %}Password Updated | LegalCRM{% endblock %}

{% block body %}
<div class="row justify-content-center py-5">
    <div class="col-12 col-md-5 col-lg-4">
        <div class="card shadow-sm border-0 rounded-3 text-center">
            <div class="card-body p-4 p-md-5">
                <div class="d-inline-flex p-3 rounded-circle bg-success bg-opacity-10 text-success mb-3">
                    <i data-lucide="check-circle" style="width: 36px; height: 36px;"></i>
                </div>
                <h4 class="fw-bold text-dark mb-2">Password Updated</h4>
                <p class="text-muted small mb-4">
                    Your password has been reset successfully. You can now log in with your new credentials.
                </p>
                <a href="{% url 'login' %}" class="btn btn-primary w-100 py-2 fw-semibold">
                    Sign In to Portal
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
