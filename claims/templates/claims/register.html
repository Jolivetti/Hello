{% extends "claims/layout.html" %}

{% block body %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h3 class="fw-bold mb-3 text-center">Sign In</h3>
                    
                    {% if message %}
                        <div class="alert alert-danger py-2 small">{{ message }}</div>
                    {% endif %}

                    <form action="{% url 'login' %}" method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Username</label>
                            <input class="form-control" autofocus type="text" name="username" placeholder="Username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Password</label>
                            <input class="form-control" type="password" name="password" placeholder="Password" required>
                        </div>
                        <button class="btn btn-primary w-100 py-2 fw-semibold" type="submit">Log In</button>
                    </form>
                    <div class="text-center mt-3 small">
                        Don't have an account? <a href="{% url 'register' %}">Register here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
