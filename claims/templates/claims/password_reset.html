{% extends "claims/layout.html" %}

{% block title %}Reset Password | LegalCRM{% endblock %}

{% block body %}
<div class="row justify-content-center py-5">
    <div class="col-12 col-md-5 col-lg-4">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-2">
                        <i data-lucide="key-round" style="width: 32px; height: 32px;"></i>
                    </div>
                    <h4 class="fw-bold text-dark mb-1">Forgot Password?</h4>
                    <p class="text-muted small mb-0">Enter your registered email address to receive a secure password reset link.</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-secondary text-uppercase">Registered Email</label>
                        <input type="email" name="email" class="form-control" placeholder="carlos@example.com" required autofocus>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        Send Reset Link
                    </button>
                </form>

                <div class="mt-4 pt-3 border-top text-center">
                    <a href="{% url 'login' %}" class="small text-muted text-decoration-none">&larr; Return to Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
